name: nirvaan
description: AI-powered travel platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  riverpod_annotation: ^2.3.5
  # State management
  flutter_riverpod: ^2.5.1

  # Secure JWT storage
  flutter_secure_storage: ^9.2.2

  # HTTP client for backend calls
  http: ^1.6.0

  # Fonts
  google_fonts: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.8
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  google_sign_in: 6.1.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  
  # Date picker
  flutter_datetime_picker_plus: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
